<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Task Manager</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f4f6f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background: white;
        padding: 20px;
        width: 400px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 15px;
    }

    input {
        width: 70%;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button {
        padding: 8px 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .add-btn {
        background-color: #4CAF50;
        color: white;
    }

    .delete-btn {
        background-color: #f44336;
        color: white;
        margin-left: 5px;
    }

    .complete-btn {
        background-color: #2196F3;
        color: white;
        margin-left: 5px;
    }

    ul {
        list-style: none;
        padding: 0;
        margin-top: 15px;
    }

    li {
        background: #f1f1f1;
        padding: 8px;
        margin-bottom: 8px;
        border-radius: 5px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .completed {
        text-decoration: line-through;
        color: gray;
    }

    .message {
        text-align: center;
        color: red;
        font-size: 14px;
    }

    .count {
        margin-top: 10px;
        font-weight: bold;
        text-align: center;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Smart Task Manager</h2>

    <input type="text" id="taskInput" placeholder="Enter a new task">
    <button class="add-btn" onclick="addTask()">Add Task</button>

    <p class="message" id="message"></p>

    <ul id="taskList"></ul>

    <div class="count" id="taskCount">Total Tasks: 0</div>
</div>

<script>
    let tasks = [];   

    function addTask() {
        const input = document.getElementById("taskInput");
        const message = document.getElementById("message");
        const taskText = input.value.trim();

        if (taskText === "") {
            message.textContent = "Task cannot be empty!";
            return;
        } else {
            message.textContent = "";
        }

        tasks.push({
            text: taskText,
            completed: false
        });

        input.value = "";
        displayTasks();
    }

    function displayTasks() {
        const taskList = document.getElementById("taskList");
        const taskCount = document.getElementById("taskCount");

        taskList.innerHTML = "";

        if (tasks.length === 0) {
            taskList.innerHTML = "<p style='text-align:center;'>No tasks available</p>";
        }

        for (let i = 0; i < tasks.length; i++) {

            const li = document.createElement("li");

            if (tasks[i].completed) {
                li.classList.add("completed");
            }

            li.textContent = tasks[i].text;

            const completeBtn = document.createElement("button");
            completeBtn.textContent = "✔";
            completeBtn.className = "complete-btn";
            completeBtn.onclick = function () {
                toggleComplete(i);
            };

            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "✖";
            deleteBtn.className = "delete-btn";
            deleteBtn.onclick = function () {
                deleteTask(i);
            };

            li.appendChild(completeBtn);
            li.appendChild(deleteBtn);

            taskList.appendChild(li);
        }

        taskCount.textContent = "Total Tasks: " + tasks.length;
    }

    function toggleComplete(index) {
        tasks[index].completed = !tasks[index].completed;
        displayTasks();
    }

    function deleteTask(index) {
        tasks.splice(index, 1);
        displayTasks();
    }

    document.getElementById("taskInput").addEventListener("keypress", function(event) {
        if (event.key === "Enter") {
            addTask();
        }
    });
</script>

</body>
</html>
