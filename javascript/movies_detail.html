<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        background:linear-gradient(180deg,rgb(230, 92, 0),white,rgb(1, 121, 1));
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
        height:100vh
      }
      #movie-container{
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
        gap: 20px;
        padding: 20px;
      }
      .movie-card{
        border: 1px solid;
        box-shadow: 0px 4px 8px;
        border-radius: 4px;
      }
      .movie-card:hover{
        transform: scale(1.03);
      }
      input{
        margin-top: 5px;
        border: 1px solid;
        border-radius: 4px;
        padding: 4px;
      }
      #btn{
        padding: 4px;
        border: none;
        background-color: rgb(45, 170, 236);
        border-radius: 4px;
        font-family: cursive;
      }
      img{
        width: 100%;
        object-fit: cover;
      }

    </style>
  </head>
  <body>
    <input type="text" id="input" />

    <button id="btn" onclick="fetchmovie()">Search</button>

    <div id="movie-container"></div>

    <script>
        const moviecontainer = document.getElementById("movie-container")
        
        async function fetchmovie(){
            const moviename = document.getElementById("input").value
            try{
                const response = await fetch(`https://www.omdbapi.com/?s=${moviename}&apikey=e7f67a81`)

                const data = await response.json()

                console.log(data)
                if(data.Search){
                    displaymovie(data.Search.slice(0,10));

                }
                else{
                    moviecontainer.innerHTML = `<p>No movie Found</p>`
                }

            }
            catch(error){
                console.log("error fetching movie")
            }
        }
        //function to show movies:
        function displaymovie(movies){
            moviecontainer.innerHTML = "";

            movies.forEach( (x)=>{
                const moviecard = document.createElement("div")
                moviecard.classList.add("movie-card");
                moviecard.innerHTML = `
                <img src=${x.Poster}/>
                <div class="movie-title"> ${x.Title} (${x.Year})</div>`

                moviecontainer.appendChild(moviecard)
            })
        }


    </script>
  </body>
</html>
