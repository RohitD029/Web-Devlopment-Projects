<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal expence tracker</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header>
      <h1><strong>My Expence Tracker</strong></h1>
      <h3>Track your monthly spendings...</h3>
    </header>

    <div class="parent">
      <div class="feature">
        <img src="./expense category.png" alt="" />
        <h4><strong>Total Spent</strong></h4>
      </div>
      <div class="feature">
        <img src="./category 2.png" alt="" />
        <h4><strong>Heighest Category</strong></h4>
      </div>
      <div class="feature">
        <img src="./calender.png" alt="" />
        <h4><strong>Current Month</strong></h4>
      </div>
    </div>
    <div class="summary">
      <ul>
        <li>Food - <span>₹100</span></li>
        <li>Transport - <span>₹60</span></li>
        <li>Shopping - <span>₹250</span></li>
        <li>Entertainment - <span>₹120</span></li>
      </ul>
    </div>
  </body>
</html>
